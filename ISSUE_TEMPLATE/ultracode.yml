name: Большая задача (ultracode)
description: Крупная задача — Claude строит multi-agent реализацию с независимой самопроверкой. Дольше и дороже
labels: [ultracode]
body:
  - type: markdown
    attributes:
      value: |
        Режим ultracode: реализация, затем независимые ревьюеры и исправления — PR приходит уже проверенным. До 5 часов, лимит $15 — заметно расходует лимиты подписки. Вместе с меткой `max` — ultracode на максимальном effort (лимит $30). Claude возьмёт задачу сразу после создания issue и откроет draft PR. Ревью — комментарии к строкам, затем **Submit review** с `@claude` в итоговом тексте. Мёржишь только ты.
  - type: input
    id: trigger
    attributes:
      label: Исполнитель
      description: Это поле запускает Claude — не меняй его.
      value: "@claude"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Цель
      description: Что нужно сделать и зачем.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Критерии приёмки
      description: Как понять, что сделано правильно. По одному проверяемому пункту на строку.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: dont-touch
    attributes:
      label: Не трогать
      description: Файлы, модули и поведение, которые менять нельзя.
  - type: textarea
    id: notes
    attributes:
      label: Заметки
      description: Ссылки, примеры, подсказки по реализации.
