name: claude-max
description: Сложная задача — Claude на максимальной глубине рассуждения
labels: [claude, max]
body:
  - type: markdown
    attributes:
      value: |
        Режим max: один агент на максимальной глубине рассуждения — и в задаче, и в раундах ревью этого PR. До 3 часов, лимит $15. Claude возьмёт задачу сразу после создания issue и откроет draft PR. Замечания оставляй в ревью PR, а в итоговом комментарии ревью пиши `@claude`. Мёржишь ты.
  - type: textarea
    id: task
    attributes:
      label: Что сделать
      description: Суть задачи и зачем она нужна.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Готово, когда
      description: Проверяемые критерии — по одному на строку.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: dont-touch
    attributes:
      label: Не трогать
      description: Файлы, модули или поведение, которые менять нельзя.
  - type: textarea
    id: context
    attributes:
      label: Контекст
      description: Ссылки, примеры, подсказки по реализации.
